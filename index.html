<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Amazon Wireless Earbuds — Market Analysis</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fa;
            color: #1f2937;
            min-height: 100vh;
        }

        .header {
            background: #ffffff;
            padding: 28px 5%;
            border-bottom: 1px solid #e5e7eb;
        }

        .header h1 {
            font-size: 30px;
            margin-bottom: 8px;
            color: #1f2937;
        }

        .header p {
            color: #6b7280;
            font-size: 15px;
        }

        .container {
            width: 92%;
            max-width: 1500px;
            margin: 30px auto;
        }

        .dashboard-card {
            background: white;
            border-radius: 14px;
            padding: 18px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        }

        .dashboard-card img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 8px;
        }

        .footer {
            text-align: center;
            padding: 25px;
            color: #6b7280;
            font-size: 13px;
        }

        @media (max-width: 700px) {
            .header h1 {
                font-size: 22px;
            }

            .container {
                width: 96%;
                margin: 15px auto;
            }
        }
    </style>
</head>

<body>

    <header class="header">
        <h1>Amazon Wireless Earbuds — Market Analysis Dashboard</h1>
        <p>Live Amazon Product Data Analysis | Python • Pandas • SQL • Power BI</p>
    </header>

    <main class="container">
        <div class="dashboard-card">
            <img
                src="dashboard.png"
                alt="Amazon Wireless Earbuds Market Analysis Dashboard"
            >
        </div>
    </main>

    <footer class="footer">
        Amazon Live Product Data Analysis — Portfolio Project
    </footer>

</body>
</html>
